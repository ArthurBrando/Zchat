<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zchat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <header class="top-bar">
                <h1>Zchat</h1>
                <div class="actions">
                    <button onclick="window.openModal('modal-add-contact')" class="icon-btn">
                        <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </button>
                    <button onclick="window.openModal('modal-new-group')" class="icon-btn">
                        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    </button>
                    <button onclick="window.openProfile()" class="icon-btn">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </button>
                </div>
            </header>
            
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Pesquisar..." id="search-input" oninput="window.filterList()">
            </div>
            <div class="list-container" id="chat-list"></div>
        </aside>

        <main class="chat-area" id="chat-area">
            <div class="empty-state" id="empty-state">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                <h2>Zchat</h2>
                <p>Seguro, rápido e privado.</p>
            </div>

            <div class="chat-window hidden" id="chat-window">
                <header class="chat-top-bar">
                    <button class="icon-btn back-btn" onclick="window.closeChat()">
                        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </button>
                    <div class="chat-header-info" onclick="window.openChatInfo()" style="cursor: pointer;">
                        <h3 id="chat-name">Nome</h3>
                        <span id="typing-status" class="typing-text hidden">digitando...</span>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn" onclick="window.startCall('video')"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
                        <button class="icon-btn" onclick="window.startCall('audio')"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
                        <button class="icon-btn" onclick="window.openChatMenu()"><svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
                    </div>
                </header>

                <div class="messages" id="messages-container"></div>

                <div class="input-bar">
                    <button class="icon-btn" onclick="window.toggleEmoji()"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
                    <input type="text" id="message-input" placeholder="Mensagem..." oninput="window.handleTyping()">
                    <button class="icon-btn" onclick="window.openModal('modal-gif')"><span style="font-weight:800; font-size:14px;">GIF</span></button>
                    <button class="icon-btn" onclick="window.openModal('modal-media')"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
                    <button class="icon-btn hidden" id="btn-send" onclick="window.sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
                    <button class="icon-btn" id="btn-mic" onclick="window.toggleRecord()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
                </div>
            </div>
        </main>
    </div>

    <!-- EMOJI PICKER -->
    <div id="emoji-picker" class="emoji-picker hidden">
        <div class="emoji-grid" id="emoji-grid"></div>
    </div>

    <!-- MENU DO CHAT (3 PONTOS) -->
    <div id="chat-menu" class="modal hidden">
        <div class="modal-box menu-box">
            <button onclick="window.changeWallpaper()">Mudar Papel de Parede</button>
            <button onclick="window.clearChat()">Apagar Conversa (Para Mim)</button>
            <button id="btn-block-user" onclick="window.blockUser()" class="text-danger">Bloquear Usuário</button>
            <button class="btn-secondary" onclick="window.closeModal('chat-menu')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL: INFO DO CHAT / PERFIL / GRUPO -->
    <div id="chat-info-modal" class="modal hidden">
        <div class="modal-box info-box">
            <div class="info-header">
                <div class="avatar-xl" style="margin:0 auto; width:80px; height:80px; font-size:30px;" id="info-avatar">Z</div>
                <h2 id="info-name" style="margin-top:10px;">Nome</h2>
                <p id="info-bio" style="color:var(--text-muted); font-size:14px;">Bio...</p>
            </div>
            
            <div id="group-members-area" class="hidden">
                <h3 style="margin: 15px 0 10px; font-size:14px; color:var(--text-muted); text-transform:uppercase;">Membros do Grupo</h3>
                <div id="group-members-list" style="max-height:200px; overflow-y:auto;"></div>
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-secondary" style="flex:1;" onclick="window.closeModal('chat-info-modal')">Fechar</button>
                <button class="btn-danger-outline hidden" id="btn-block-info" style="flex:1;" onclick="window.blockUser()">Bloquear</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE GIFS -->
    <div id="modal-gif" class="modal hidden">
        <div class="modal-box" style="height: 80vh; max-width: 500px;">
            <div class="input-group" style="flex-direction: row; align-items: center;">
                <input type="text" id="gif-search" placeholder="Pesquisar GIFs (Aperte Enter)" style="flex:1;">
            </div>
            <div id="gif-container" style="flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:10px; overflow-y:auto; margin-top:10px;">
                <!-- GIFs aqui -->
            </div>
            <button class="btn-secondary" style="margin-top:10px;" onclick="window.closeModal('modal-gif')">Fechar</button>
        </div>
    </div>

    <!-- TELA DE PERFIL -->
    <div id="profile-screen" class="screen hidden">
        <header class="top-bar">
            <button class="icon-btn" onclick="window.closeProfile()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
            <h2>Meu Perfil</h2>
        </header>
        <div class="screen-content">
            <div class="profile-avatar-container">
                <div class="avatar-xl" id="profile-avatar-xl">
                    <img id="profile-img-preview" class="hidden">
                    <span id="profile-letter">Z</span>
                </div>
                <label class="btn-camera">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="file" id="input-avatar" accept="image/*,image/gif">
                </label>
            </div>
            <div class="input-group">
                <label>Nome</label>
                <input type="text" id="profile-name" placeholder="Seu nome">
            </div>
            <div class="input-group">
                <label>Recado (Bio)</label>
                <input type="text" id="profile-bio" placeholder="Status...">
            </div>
            <div class="input-group">
                <label>Seu Token (ID)</label>
                <div class="token-box" id="my-token">...</div>
            </div>
            <button class="btn-primary" onclick="window.saveProfile()">Salvar Alterações</button>
            <button class="btn-danger-outline" onclick="window.resetAccount()">Resetar Conta</button>
        </div>
    </div>

    <!-- MODAIS DE CRIAÇÃO -->
    <div id="modal-add-contact" class="modal hidden">
        <div class="modal-box">
            <h2>Novo Contato</h2>
            <div class="input-group"><label>Token</label><input type="text" id="add-contact-token" placeholder="Ex: zc_1234"></div>
            <div class="input-group"><label>Salvar como</label><input type="text" id="add-contact-name" placeholder="Nome"></div>
            <button class="btn-primary" onclick="window.createContact()">Adicionar</button>
            <button class="btn-secondary" onclick="window.closeModal('modal-add-contact')">Cancelar</button>
        </div>
    </div>

    <div id="modal-new-group" class="modal hidden">
        <div class="modal-box">
            <h2>Novo Grupo</h2>
            <div class="input-group"><label>Nome do Grupo</label><input type="text" id="new-group-name" placeholder="Ex: Amigos"></div>
            <div class="input-group"><label>Membros (Tokens)</label><input type="text" id="new-group-members" placeholder="zc_1234, zc_5678"></div>
            <button class="btn-primary" onclick="window.createGroup()">Criar Grupo</button>
            <button class="btn-secondary" onclick="window.closeModal('modal-new-group')">Cancelar</button>
        </div>
    </div>

    <div id="modal-media" class="modal hidden">
        <div class="modal-box media-box">
            <button class="media-option" onclick="document.getElementById('input-image').click()">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <span>Galeria</span>
            </button>
            <input type="file" id="input-image" class="hidden" accept="image/*,image/gif" onchange="window.handleImageUpload(event)">
            <button class="media-option" onclick="window.startCall('video')">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                <span>Vídeo</span>
            </button>
        </div>
    </div>

    <!-- TELA: OPÇÕES DE MEMBRO DO GRUPO -->
    <div id="member-action-modal" class="modal hidden">
        <div class="modal-box">
            <h2 id="member-action-name">Nome</h2>
            <button class="btn-primary" onclick="window.promoteMember()">Promover a Admin</button>
            <button class="btn-secondary" onclick="window.muteMember()">Silenciar / Mutar</button>
            <button class="btn-danger-outline" onclick="window.kickMember()">Remover do Grupo (Kick)</button>
            <button class="btn-danger-outline" onclick="window.banMember()">Banir Permanentemente</button>
            <button class="btn-secondary" style="margin-top:10px;" onclick="window.closeModal('member-action-modal')">Fechar</button>
        </div>
    </div>

    <!-- CALL OVERLAY -->
    <div id="call-overlay" class="hidden">
        <video id="remote-video" autoplay></video>
        <video id="local-video" autoplay muted></video>
        <div class="call-actions">
            <button class="call-btn" id="btn-mute" onclick="window.toggleMic()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
            <button class="call-btn danger" onclick="window.endCall()"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
            <button class="call-btn" id="btn-cam" onclick="window.toggleVideo()"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
        </div>
    </div>

    <canvas id="resize-canvas" class="hidden"></canvas>
    <script type="module" src="app.js"></script>
</body>
</html>
