<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zchat</title>
    <link rel="stylesheet" href="style.css">
    <!-- 20+ Fontes Diferentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono&family=Press+Start+2P&family=Pacifico&family=Caveat&family=Dancing+Script&family=Shadows+Into+Light&family=Indie+Flower&family=Permanent+Marker&family=Amatic+SC&family=Gloria+Hallelujah&family=Satisfy&family=Cinzel&family=Playfair+Display&family=Oswald&family=Raleway&family=Righteous&family=Orbitron&family=Bebas+Neue&family=ZCOOL+KuaiLe&family=VT323&family=Creepster&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <header class="top-bar">
                <h1>Zchat</h1>
                <div class="actions">
                    <button onclick="window.openModal('modal-add-contact')" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
                    <button onclick="window.openModal('modal-new-group')" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></button>
                    <button onclick="window.openProfile()" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
                </div>
            </header>
            <div class="search-bar">
                <input type="text" placeholder="Pesquisar..." id="search-input" oninput="window.filterList()">
            </div>
            <div class="list-container" id="chat-list">
                <!-- Botão Fixo do Zchat AI -->
                <div class="chat-item ai-item" onclick="window.openChat('ai_chat', 'ai', 'Zchat AI', 'ai')">
                    <div class="avatar-small" style="background:#fff; color:#000; font-weight:900;">AI</div>
                    <div class="chat-info"><h4>Zchat AI</h4><p>Pergunte qualquer coisa</p></div>
                </div>
            </div>
        </aside>

        <main class="chat-area" id="chat-area">
            <div class="empty-state" id="empty-state">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                <h2>Zchat</h2>
                <p>Seguro, rápido e privado.</p>
            </div>
            <div class="chat-window hidden" id="chat-window">
                <header class="chat-top-bar">
                    <button class="icon-btn back-btn" onclick="window.closeChat()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
                    <div class="chat-header-info" onclick="window.openChatInfo()" style="cursor: pointer; display: flex; align-items: center; gap: 10px;">
                        <div class="avatar-small" id="chat-header-avatar" style="width: 36px; height: 36px; font-size: 14px;">Z</div>
                        <div>
                            <h3 id="chat-name">Nome</h3>
                            <span id="chat-status" class="typing-text">online</span>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn" onclick="window.startCall('video')"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
                        <button class="icon-btn" onclick="window.startCall('audio')"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
                        <button class="icon-btn" onclick="window.openChatMenu()"><svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
                    </div>
                </header>
                <div class="messages" id="messages-container"></div>
                <div id="reply-preview" class="reply-preview hidden">
                    <div><strong id="reply-name"></strong><p id="reply-text"></p></div>
                    <button onclick="window.cancelReply()" class="icon-btn">✕</button>
                </div>
                <div class="input-bar" id="input-bar">
                    <button class="icon-btn" onclick="window.toggleEmoji('msg')"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
                    <input type="text" id="message-input" placeholder="Mensagem..." oninput="window.handleTyping()">
                    <button class="icon-btn" onclick="window.openModal('modal-gif')"><span style="font-weight:800; font-size:14px;">GIF</span></button>
                    <button class="icon-btn" onclick="window.openModal('modal-media')"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
                    <button class="icon-btn hidden" id="btn-send" onclick="window.sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
                    <button class="icon-btn" id="btn-mic" onclick="window.toggleRecord()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
                </div>
            </div>
        </main>
    </div>

    <!-- MENUS E MODAIS -->
    <div id="emoji-picker" class="emoji-picker hidden">
        <div class="emoji-grid" id="emoji-grid"></div>
    </div>

    <!-- MENU DE CONTEXTO (SEGURAR MENSAGEM) -->
    <div id="msg-context-menu" class="modal hidden">
        <div class="modal-box menu-box">
            <button onclick="window.replyMessage()">Responder</button>
            <button onclick="window.reactToMessage()">Reagir</button>
            <button onclick="window.forwardMessage()">Encaminhar</button>
            <button onclick="window.deleteForMe()" class="text-danger">Apagar para mim</button>
            <button class="btn-secondary" onclick="window.closeModal('msg-context-menu')">Cancelar</button>
        </div>
    </div>

    <!-- MENU DO CHAT (3 PONTOS) -->
    <div id="chat-menu" class="modal hidden">
        <div class="modal-box menu-box">
            <button onclick="window.changeWallpaper()">Mudar Papel de Parede</button>
            <button onclick="window.deleteContact()" class="text-danger">Apagar Contato</button>
            <button class="btn-secondary" onclick="window.closeModal('chat-menu')">Fechar</button>
        </div>
    </div>

    <!-- ENCAMINHAR -->
    <div id="modal-forward" class="modal hidden">
        <div class="modal-box">
            <h2>Encaminhar para...</h2>
            <div id="forward-list" class="list-container" style="max-height:200px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; margin-bottom:10px;"></div>
            <button class="btn-secondary" onclick="window.closeModal('modal-forward')">Cancelar</button>
        </div>
    </div>

    <!-- PERFIL AVANÇADO -->
    <div id="profile-screen" class="screen hidden">
        <header class="top-bar">
            <button class="icon-btn" onclick="window.closeProfile()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
            <h2>Meu Perfil</h2>
        </header>
        <div class="screen-content">
            <div class="profile-avatar-container">
                <div class="avatar-xl" id="profile-avatar-xl">
                    <img id="profile-img-preview" class="hidden">
                    <span id="profile-letter">Z</span>
                </div>
                <label class="btn-camera">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="file" id="input-avatar" accept="image/*,image/gif">
                </label>
            </div>
            <div class="input-group"><label>Nome</label><input type="text" id="profile-name"></div>
            <div class="input-group"><label>Bio</label><input type="text" id="profile-bio"></div>
            
            <div class="input-group">
                <label>Fonte do Nome (20+ Opções)</label>
                <select id="profile-font" style="padding:16px; border-radius:12px; background:var(--panel); color:#fff; border:1px solid var(--border);">
                    <option value="'Inter', sans-serif">Padrão (Inter)</option>
                    <option value="'Roboto Mono', monospace">Monoespaçada</option>
                    <option value="'Press Start 2P', cursive">Retro Gamer</option>
                    <option value="'Pacifico', cursive">Paz e Amor</option>
                    <option value="'Caveat', cursive">Manuscrita</option>
                    <option value="'Dancing Script', cursive">Cursiva Elegante</option>
                    <option value="'Shadows Into Light', cursive">Leve</option>
                    <option value="'Indie Flower', cursive">Descontraída</option>
                    <option value="'Permanent Marker', cursive">Marcador</option>
                    <option value="'Amatic SC', cursive">Fina Alta</option>
                    <option value="'Gloria Hallelujah', cursive">Infantil</option>
                    <option value="'Satisfy', cursive">Fluxo</option>
                    <option value="'Cinzel', serif">Clássica</option>
                    <option value="'Playfair Display', serif">Elegante</option>
                    <option value="'Oswald', sans-serif">Impacto</option>
                    <option value="'Raleway', sans-serif">Moderna</option>
                    <option value="'Righteous', cursive">Futurista</option>
                    <option value="'Orbitron', sans-serif">Sci-Fi</option>
                    <option value="'Bebas Neue', cursive">Cartaz</option>
                    <option value="'ZCOOL KuaiLe', cursive">Asiática</option>
                    <option value="'VT323', monospace">Terminal</option>
                    <option value="'Creepster', cursive">Gótica / Terror</option>
                </select>
            </div>

            <div class="input-group"><label>Avatar (URL)</label><input type="text" id="profile-avatar-url"></div>
            <div class="input-group"><label>Banner (URL)</label><input type="text" id="profile-banner-url"></div>

            <button class="btn-primary" onclick="window.saveProfile()">Salvar Perfil</button>
        </div>
    </div>

    <!-- MODAIS BÁSICOS (ADD CONTATO, GRUPO, MEDIA, GIF) -->
    <div id="modal-add-contact" class="modal hidden"><div class="modal-box"><h2>Novo Contato</h2><input type="text" id="add-contact-token" placeholder="Token (zc_1234)" style="margin-bottom:10px;"><input type="text" id="add-contact-name" placeholder="Nome"><button class="btn-primary" onclick="window.createContact()">Adicionar</button><button class="btn-secondary" onclick="window.closeModal('modal-add-contact')">Cancelar</button></div></div>
    <div id="modal-new-group" class="modal hidden"><div class="modal-box"><h2>Novo Grupo</h2><input type="text" id="new-group-name" placeholder="Nome do Grupo" style="margin-bottom:10px;"><input type="text" id="new-group-members" placeholder="Tokens separados por vírgula"><button class="btn-primary" onclick="window.createGroup()">Criar</button><button class="btn-secondary" onclick="window.closeModal('modal-new-group')">Cancelar</button></div></div>
    <div id="modal-media" class="modal hidden"><div class="modal-box media-box"><button class="media-option" onclick="document.getElementById('input-image').click()"><span>Galeria</span></button><input type="file" id="input-image" class="hidden" accept="image/*,image/gif" onchange="window.handleImageUpload(event)"></div></div>
    
    <div id="modal-gif" class="modal hidden">
        <div class="modal-box" style="height: 80vh;">
            <input type="text" id="gif-search" placeholder="Pesquisar GIFs (Enter)" style="margin-bottom:10px;">
            <div id="gif-container" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; overflow-y:auto; flex:1;"></div>
            <button class="btn-secondary" style="margin-top:10px;" onclick="window.closeModal('modal-gif')">Fechar</button>
        </div>
    </div>

    <!-- TELA: OPÇÕES DE MEMBRO DO GRUPO -->
    <div id="member-action-modal" class="modal hidden">
        <div class="modal-box">
            <h2 id="member-action-name">Nome</h2>
            <button class="btn-primary" onclick="window.muteMember()">Silenciar / Mutar</button>
            <button class="btn-danger-outline" onclick="window.kickMember()">Remover do Grupo</button>
            <button class="btn-secondary" onclick="window.closeModal('member-action-modal')">Fechar</button>
        </div>
    </div>

    <div id="chat-info-modal" class="modal hidden">
        <div class="modal-box info-box">
            <h2 id="info-name">Nome</h2>
            <p id="info-bio" style="color:var(--text-muted); margin-bottom:15px;">Bio...</p>
            <div id="group-members-list" style="max-height:200px; overflow-y:auto; text-align:left;"></div>
            <button class="btn-secondary" style="margin-top:15px;" onclick="window.closeModal('chat-info-modal')">Fechar</button>
        </div>
    </div>

    <div id="call-overlay" class="hidden">
        <video id="remote-video" autoplay></video>
        <video id="local-video" autoplay muted></video>
        <div class="call-actions">
            <button class="call-btn danger" onclick="window.endCall()">Encerrar</button>
        </div>
    </div>

    <canvas id="resize-canvas" class="hidden"></canvas>
    <script type="module" src="app.js"></script>
</body>
</html>
