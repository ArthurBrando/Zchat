<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zchat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- TELA 1: LISTA DE CONVERSAS (Estilo WhatsApp) -->
        <aside class="sidebar" id="sidebar">
            <header class="header-wa">
                <h1>Zchat</h1>
                <div class="header-icons">
                    <button onclick="window.openModal('add-contact-modal')"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
                    <button onclick="window.openProfile()"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
                </div>
            </header>
            
            <div class="search-container">
                <div class="search-bar">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" placeholder="Pesquisar" id="search-chat" oninput="window.filterChats()">
                </div>
            </div>

            <div class="filters">
                <span class="filter-chip active">Todas</span>
                <span class="filter-chip">Não lidas</span>
                <span class="filter-chip">Grupos</span>
            </div>

            <div class="chat-list" id="chat-list"></div>

            <!-- Botão Flutuante (FAB) para criar Grupo -->
            <button class="fab" onclick="window.openModal('group-modal')">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </aside>

        <!-- TELA 2: CHAT -->
        <main class="chat-area" id="main-chat">
            <div class="empty-state" id="empty-state">
                <h1>Zchat</h1>
                <p>Mensagens e chamadas seguras.</p>
            </div>

            <div class="chat-window hidden" id="chat-window">
                <header class="chat-header">
                    <button class="back-btn" onclick="window.closeChat()"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
                    <div class="avatar-small" id="chat-avatar">Z</div>
                    <div class="chat-info">
                        <h3 id="chat-title">Nome</h3>
                        <span id="typing-indicator" class="hidden">digitando...</span>
                    </div>
                    <div class="call-actions">
                        <button onclick="window.startCall('video')"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
                        <button onclick="window.startCall('audio')"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
                    </div>
                </header>

                <div class="messages" id="messages-container"></div>

                <div class="input-area">
                    <div class="input-box">
                        <button onclick="window.toggleEmoji()"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
                        <input type="text" id="message-input" placeholder="Mensagem" oninput="window.handleTyping()">
                        <button onclick="window.openModal('media-modal')"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
                    </div>
                    
                    <button class="send-btn hidden" id="send-btn" onclick="window.sendMessage()"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
                    <button class="record-btn" id="record-btn" onclick="window.toggleRecord()"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
                </div>
            </div>
        </main>
    </div>

    <!-- TELA 3: PERFIL (Estilo WhatsApp) -->
    <div id="profile-page" class="mobile-page hidden">
        <header class="wa-header">
            <button onclick="window.closeProfile()"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
            <h2>Perfil</h2>
        </header>

        <div class="profile-content">
            <div class="profile-pic-container">
                <div class="avatar-huge" id="profile-avatar-big">
                    <img id="profile-img" src="" style="display:none;">
                    <span id="profile-letter">Z</span>
                </div>
                <label class="camera-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="file" id="set-avatar-file" accept="image/*,image/gif">
                </label>
            </div>

            <div class="profile-field">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#888"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <div>
                    <label>Nome</label>
                    <input type="text" id="set-name" placeholder="Seu nome">
                </div>
            </div>

            <div class="profile-field">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#888"><path d="M11 7h2v6h-2zm0 8h2v2h-2z"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <div>
                    <label>Recado</label>
                    <input type="text" id="set-bio" placeholder="Definir recado">
                </div>
            </div>

            <div class="profile-field">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#888"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <div>
                    <label>Seu ID Único</label>
                    <span id="modal-token" style="color:#00a884; font-weight:bold;"></span>
                </div>
            </div>

            <button class="wa-btn-primary" onclick="window.saveProfile()">Salvar Perfil</button>
        </div>
    </div>

    <!-- MODAIS -->
    <div id="add-contact-modal" class="modal hidden">
        <div class="modal-content wa-modal">
            <h2>Novo Contato</h2>
            <input type="text" id="contact-id-input" placeholder="ID do Contato (Ex: zc_1234)">
            <input type="text" id="contact-name-input" placeholder="Nome (Como quer salvar?)">
            <button class="wa-btn-primary" onclick="window.addContact()">Adicionar</button>
            <button class="wa-btn-secondary" onclick="window.closeModal('add-contact-modal')">Cancelar</button>
        </div>
    </div>

    <div id="group-modal" class="modal hidden">
        <div class="modal-content wa-modal">
            <h2>Novo Grupo</h2>
            <input type="text" id="group-name-input" placeholder="Nome do Grupo">
            <input type="text" id="group-members-input" placeholder="IDs dos Membros (vírgula)">
            <button class="wa-btn-primary" onclick="window.createGroup()">Criar Grupo</button>
            <button class="wa-btn-secondary" onclick="window.closeModal('group-modal')">Cancelar</button>
        </div>
    </div>

    <div id="media-modal" class="modal hidden">
        <div class="modal-content wa-modal" style="flex-direction:row; justify-content:space-around; padding: 30px;">
            <button class="wa-media-btn" onclick="document.getElementById('media-upload').click()">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="#00a884"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <span>Galeria</span>
            </button>
            <input type="file" id="media-upload" accept="image/*,image/gif" class="hidden" onchange="window.handleImage(event)">
            
            <button class="wa-media-btn" onclick="window.startCall('video')">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="#00a884"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                <span>Vídeo</span>
            </button>
        </div>
    </div>

    <!-- Emoji Picker Simples -->
    <div id="emoji-panel" class="emoji-panel hidden">
        <div class="emoji-grid" id="emoji-grid"></div>
    </div>

    <!-- Call Overlay -->
    <div id="call-overlay" class="hidden">
        <video id="remote-video" autoplay></video>
        <video id="local-video" autoplay muted></video>
        <div class="call-controls">
            <button onclick="window.toggleMic()" id="btn-mic"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
            <button onclick="window.endCall()" class="danger"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
            <button onclick="window.toggleVideo()" id="btn-cam"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
        </div>
    </div>

    <canvas id="resize-canvas" class="hidden"></canvas>
    <script type="module" src="app.js"></script>
</body>
</html>
